spring.application.name=medisync
server.address=0.0.0.0
server.port=8080
# ─── Datasource ────────────────────────────────────────────────────────────────
# En local : MySQL par défaut. En production : définir les variables d'environnement
# DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, DATABASE_DRIVER, HIBERNATE_DIALECT.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/medisync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ─── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ─── JWT ───────────────────────────────────────────────────────────────────────
# En production : définir la variable d'environnement JWT_SECRET (ne jamais committer la vraie valeur).
# La valeur ci-dessous est un fallback pour le développement local uniquement.
jwt.secret=${JWT_SECRET:TFwKTC9Gzc/mvVHUCDZ3ncoxuZFvxy68M9+sP3zVxA0=}
jwt.expiration-ms=315360000000

# ─── Admin de démarrage (dev uniquement) ───────────────────────────────────────
# Compte admin créé automatiquement au démarrage s'il n'existe pas déjà.
# Vider admin.bootstrap.password pour désactiver.
admin.bootstrap.email=admin@medisync.tn
admin.bootstrap.password=123

# ─── Délégués de test (dev uniquement) ─────────────────────────────────────────
# 5 comptes délégué créés automatiquement au démarrage s'ils n'existent pas déjà.
# Vider test.delegue.password pour désactiver.
test.delegue.password=123

# ─── Médecins de test (dev uniquement) ─────────────────────────────────────────
# 5 comptes médecin créés automatiquement au démarrage s'ils n'existent pas déjà.
# Vider test.medecin.password pour désactiver.
test.medecin.password=123

# ─── Email (vérification d'inscription) ────────────────────────────────────────
# app.mail.enabled=false par défaut : les emails de vérification sont juste loggés
# en console au lieu d'être réellement envoyés (pratique en dev sans config SMTP).
# Passer à true + fournir MAIL_APP_PASSWORD (mot de passe d'application Gmail,
# voir myaccount.google.com/apppasswords) pour un envoi réel.
app.mail.enabled=true
app.mail.from=${MAIL_USERNAME:aladin2062000@gmail.com}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:aladin2062000@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Laboratoires de référence (dev uniquement) ────────────────────────────────
# Liste des laboratoires pharmaceutiques insérée au démarrage si absente.
# Vider laboratoire.bootstrap.password pour désactiver.
laboratoire.bootstrap.password=123
