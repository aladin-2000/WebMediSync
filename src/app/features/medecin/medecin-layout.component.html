<div class="app">
  <app-sidebar [activeView]="activeView" (viewChange)="onViewChange($event)"></app-sidebar>

  <div class="main">
    <div class="content">
      @if (activeView === 'home') {
        <app-medecin-home (navigateTo)="onViewChange($event)"></app-medecin-home>
      }
      @if (activeView === 'calendar') {
        <app-calendar (navigateTo)="onViewChange($event)"></app-calendar>
      }
      @if (activeView === 'creneaux') {
        <app-creneaux></app-creneaux>
      }
      @if (activeView === 'historique') {
        <app-historique></app-historique>
      }
      @if (activeView === 'notifications') {
        <app-notifications></app-notifications>
      }
      @if (activeView === 'notes') {
        <app-notes-equipe></app-notes-equipe>
      }
    </div>
  </div>
</div>

<!-- Note flottante (bas droite) : masquée sur la page complète des notes -->
@if (activeView !== 'notes') {
  <app-notes-equipe-fab (voirTout)="onViewChange('notes')"></app-notes-equipe-fab>
}
