<div class="stats-view">

  <div class="stats-grid-4">
    <div class="stat-card">
      <div class="stat-num" style="color: #1971c2">{{ stats.total }}</div>
      <div class="stat-label">Créneaux ce mois</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color: #2f9e44">{{ stats.reserves }}</div>
      <div class="stat-label">Visites réalisées</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color: #f59f00">{{ stats.taux }}%</div>
      <div class="stat-label">Taux remplissage</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color: #c92a2a">{{ stats.annulations }}</div>
      <div class="stat-label">Annulations</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-title">Remplissage par jour de la semaine</div>
    <div class="bar-chart">
      @for (jour of statsJours; track jour.label) {
        <div class="chart-bar">
          <div class="bar-container">
            <div class="bar" [style.height.%]="getBarHeight(jour.taux)"></div>
          </div>
          <div class="bar-label">{{ jour.label }}</div>
          <div class="bar-value">{{ jour.taux }}%</div>
        </div>
      }
    </div>
  </div>

</div>
