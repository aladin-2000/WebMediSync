<button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Ouvrir le menu">
  <i class="ti" [class.ti-menu-2]="!mobileOpen" [class.ti-x]="mobileOpen"></i>
</button>

@if (mobileOpen) {
  <div class="sidebar-backdrop" (click)="closeMobileMenu()"></div>
}

<aside class="sidebar" [class.open]="mobileOpen">
  <div class="sidebar-header">
    <img src="assets/logo.png" alt="MediSync" class="sidebar-logo-img">
  </div>

  <nav class="sidebar-nav">
    <div class="nav-group">
      <button
        class="nav-item nav-group-toggle"
        [class.open]="isMedecinsPage || medecinsMenuOpen"
        (click)="toggleMedecinsMenu()"
      >
        <i class="ti ti-users"></i>
        <span>Médecins</span>
        @if (nombreEnAttente > 0) {
          <span class="badge-count">{{ nombreEnAttente }}</span>
        }
        <i class="ti chevron" [class.ti-chevron-down]="!medecinsMenuOpen && !isMedecinsPage" [class.ti-chevron-up]="medecinsMenuOpen || isMedecinsPage"></i>
      </button>
      @if (medecinsMenuOpen || isMedecinsPage) {
        <button
          class="nav-item sub-item"
          [class.active]="activePage === 'validations'"
          (click)="navigate('validations'); closeMobileMenu()"
        >
          <span>Médecins en attente</span>
        </button>
        <button
          class="nav-item sub-item"
          [class.active]="activePage === 'medecins'"
          (click)="navigate('medecins'); closeMobileMenu()"
        >
          <span>Consulter les médecins</span>
        </button>
      }
    </div>
    <button
      class="nav-item"
      [class.active]="activePage === 'laboratoires'"
      (click)="navigate('laboratoires'); closeMobileMenu()"
    >
      <i class="ti ti-building-hospital"></i>
      <span>Laboratoires</span>
    </button>
    <div class="nav-group">
      <button
        class="nav-item nav-group-toggle"
        [class.open]="isDeleguesPage || deleguesMenuOpen"
        (click)="toggleDeleguesMenu()"
      >
        <i class="ti ti-id-badge-2"></i>
        <span>Actions sur les délégués</span>
        <i class="ti chevron" [class.ti-chevron-down]="!deleguesMenuOpen && !isDeleguesPage" [class.ti-chevron-up]="deleguesMenuOpen || isDeleguesPage"></i>
      </button>
      @if (deleguesMenuOpen || isDeleguesPage) {
        <button
          class="nav-item sub-item"
          [class.active]="activePage === 'delegues'"
          (click)="navigate('delegues'); closeMobileMenu()"
        >
          <span>Délégués en attente</span>
        </button>
        <button
          class="nav-item sub-item"
          [class.active]="activePage === 'gestion-delegues'"
          (click)="navigate('gestion-delegues'); closeMobileMenu()"
        >
          <span>Lister les délégués</span>
        </button>
      }
    </div>
    <button
      class="nav-item"
      [class.active]="activePage === 'utilisateurs'"
      (click)="navigate('utilisateurs'); closeMobileMenu()"
    >
      <i class="ti ti-user-shield"></i>
      <span>Utilisateurs</span>
    </button>
    <button
      class="nav-item"
      [class.active]="activePage === 'statistiques'"
      (click)="navigate('statistiques'); closeMobileMenu()"
    >
      <i class="ti ti-chart-bar"></i>
      <span>Statistiques</span>
    </button>
  </nav>

  <div class="sidebar-spacer"></div>

  <button class="nav-item logout" (click)="askLogout()">
    <i class="ti ti-logout"></i>
    <span>Déconnexion</span>
  </button>
</aside>

<app-modal title="Déconnexion" [visible]="showLogoutConfirm" (close)="cancelLogout()">
  <div class="modal-body">
    <p>Voulez-vous vraiment vous déconnecter ?</p>
  </div>
  <div class="modal-footer">
    <button class="btn" (click)="cancelLogout()">Annuler</button>
    <button class="btn danger" (click)="confirmLogout()">
      <i class="ti ti-logout"></i> Se déconnecter
    </button>
  </div>
</app-modal>
