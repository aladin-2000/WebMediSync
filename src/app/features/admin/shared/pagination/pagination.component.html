@if (visible) {
  <div class="pagination-bar">
    <div class="pagination-left">
      @if (pageSizeOptions.length) {
        <label class="page-size">
          Lignes par page
          <select [value]="pageSize" (change)="onPageSizeSelect($any($event.target).value)">
            @for (n of pageSizeOptions; track n) {
              <option [value]="n" [selected]="n === pageSize">{{ n }}</option>
            }
          </select>
        </label>
      }
      <span class="pagination-info">Affichage {{ startItem }}–{{ endItem }} sur {{ totalItems }}</span>
    </div>

    <div class="pagination-controls">
      @if (totalPages > 1) {
      <button class="page-btn" [disabled]="currentPage === 0" (click)="goToPage(currentPage - 1)">
        <i class="ti ti-chevron-left"></i>
      </button>

      @for (p of pages; track $index) {
        @if (p === '...') {
          <span class="ellipsis">…</span>
        } @else {
          <button class="page-btn" [class.active]="p === currentPage" (click)="goToPage(+p)">
            {{ +p + 1 }}
          </button>
        }
      }

      <button class="page-btn" [disabled]="currentPage === totalPages - 1" (click)="goToPage(currentPage + 1)">
        <i class="ti ti-chevron-right"></i>
      </button>
      }
    </div>
  </div>
}
