<div class="app">
  <app-admin-sidebar [activePage]="activePage" (pageChange)="onPageChange($event)"></app-admin-sidebar>

  <div class="main">
    <div class="content">
      @if (activePage === 'medecins') {
        <app-admin-medecins></app-admin-medecins>
      }
      @if (activePage === 'validations') {
        <app-admin-validations></app-admin-validations>
      }
      @if (activePage === 'laboratoires') {
        <app-admin-laboratoires></app-admin-laboratoires>
      }
      @if (activePage === 'statistiques') {
        <app-admin-statistiques></app-admin-statistiques>
      }
      @if (activePage === 'utilisateurs') {
        <app-utilisateurs></app-utilisateurs>
      }
    </div>
  </div>
</div>
