<aside class="sidebar">
  <!-- Logo -->
  <div class="logo">
    <span class="logo-badge"><i class="ti ti-heartbeat"></i></span>
    MediSync
  </div>

  <!-- Navigation -->
  <nav class="nav">
    <!-- Page: Recherche -->
    <div 
      class="nav-item" 
      [class.active]="activePage === 'search'"
      (click)="navigate('search')">
      <i class="ti ti-search"></i> Chercher un médecin
    </div>

    <!-- Page: Planning -->
    <div 
      class="nav-item" 
      [class.active]="activePage === 'planning'"
      (click)="navigate('planning')">
      <i class="ti ti-calendar"></i> Mon planning
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Page: Historique -->
    <div 
      class="nav-item" 
      [class.active]="activePage === 'history'"
      (click)="navigate('history')">
      <i class="ti ti-history"></i> Historique
    </div>
  </nav>

  <!-- Spacer (pousse le profil vers le bas) -->
  <div class="spacer"></div>

  <!-- Profil en bas -->
  <div class="profile-section" title="Modifier mon profil" (click)="ouvrirEditProfil()">
    <div class="profile-avatar">{{ initiales }}</div>
    <div class="profile-info">
      <div class="profile-name">{{ nomComplet }}</div>
      @if (score !== null) {
        <div class="profile-score">
          <i class="ti ti-shield-check"></i> {{ score }}/100
        </div>
      }
    </div>
    <i class="ti ti-pencil profile-edit-icon"></i>
  </div>

  <div class="nav-item logout" (click)="askLogout()">
    <i class="ti ti-logout"></i> Déconnexion
  </div>
</aside>

<app-modal title="Déconnexion" [visible]="showLogoutConfirm" (close)="cancelLogout()">
  <div class="modal-body">
    <p>Voulez-vous vraiment vous déconnecter ?</p>
  </div>
  <div class="modal-footer">
    <button class="btn-cancel" (click)="cancelLogout()">Annuler</button>
    <button class="btn-confirm danger" (click)="confirmLogout()">
      <i class="ti ti-logout"></i> Se déconnecter
    </button>
  </div>
</app-modal>

<app-modal title="Modifier mon profil" [visible]="showEditProfil" (close)="fermerEditProfil()">
  <div class="modal-body">
    <div class="field">
      <label>Nom</label>
      <input type="text" [(ngModel)]="formNom">
    </div>
    <div class="field">
      <label>Prénom</label>
      <input type="text" [(ngModel)]="formPrenom">
    </div>
    <div class="field">
      <label>Téléphone</label>
      <input type="tel" [(ngModel)]="formTelephone">
    </div>
    @if (editProfilError) {
      <div class="info-banner danger">
        <i class="ti ti-alert-triangle"></i>
        <span>{{ editProfilError }}</span>
      </div>
    }
  </div>
  <div class="modal-footer">
    <button class="btn-cancel" (click)="fermerEditProfil()">Annuler</button>
    <button class="btn-confirm" [disabled]="isSavingProfil" (click)="enregistrerProfil()">
      <i class="ti ti-check"></i> {{ isSavingProfil ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </div>
</app-modal>
