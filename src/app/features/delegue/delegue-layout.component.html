<div class="app">
  <app-delegue-sidebar [activePage]="activePage" (pageChange)="onPageChange($event)"></app-delegue-sidebar>

  <div class="main">
    <div class="content">
      @if (activePage === 'home') {
        <app-delegue-home (navigateTo)="onPageChange($event)"></app-delegue-home>
      }
      @if (activePage === 'search') {
        <app-search></app-search>
      }
      @if (activePage === 'planning') {
        <app-planning></app-planning>
      }
      @if (activePage === 'history') {
        <app-history></app-history>
      }
      @if (activePage === 'notifications') {
        <app-delegue-notifications></app-delegue-notifications>
      }
    </div>
  </div>
</div>
