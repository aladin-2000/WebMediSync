<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-box">
        <i class="ti ti-heartbeat"></i>
      </div>
      <h2>WebMediSync</h2>
      <p>Connectez-vous à votre espace dédié</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-icon">
          <i class="ti ti-user"></i>
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Entrez votre email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-icon">
          <i class="ti ti-lock"></i>
          <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Entrez votre mot de passe" required>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <i class="ti ti-alert-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="auth-footer signup-links">
      Pas encore de compte ?
      <a routerLink="/inscription/medecin">Je suis médecin</a>
      ·
      <a routerLink="/inscription/delegue">Je suis délégué</a>
    </div>
  </div>
</div>
