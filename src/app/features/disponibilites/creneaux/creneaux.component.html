<div class="creneaux-view">

  <div class="section-header">
    <div class="section-title">Rendez-vous de la semaine</div>
    <div class="header-actions">
      <button class="btn" (click)="changeWeek(-1)" aria-label="Semaine précédente">
        <i class="ti ti-chevron-left"></i>
      </button>
      <span class="week-label">{{ currentWeekLabel }}</span>
      <button class="btn" (click)="changeWeek(1)" aria-label="Semaine suivante">
        <i class="ti ti-chevron-right"></i>
      </button>
    </div>
  </div>

  <div class="week-grid">
    @for (jour of semaine(); track jour.label; let i = $index) {
      <div class="day-column">
        <div class="day-header">{{ jour.label }}</div>

        @if (jour.creneaux.length === 0) {
          <div class="empty-state">Aucun créneau</div>
        } @else {
          <div class="slots-list">
            @for (slot of jour.creneaux; track slot.heure; let j = $index) {
              <div class="timeline-slot" [class.reserve]="slot.statut === 'reserve'" [class.libre]="slot.statut === 'libre'">
                <div class="dot" [class.taken]="slot.statut === 'reserve'" [class.free]="slot.statut === 'libre'"></div>
                <span class="slot-time">{{ slot.heure }}</span>
              </div>
            }
          </div>
        }
      </div>
    }
  </div>

</div>
