@if (password) {
  <div class="strength" [class]="'strength ' + niveau" aria-live="polite">
    <div class="bar-row">
      <div class="bar">
        @for (r of regles; track r.cle; let i = $index) {
          <span class="seg" [class.on]="i < nbOk"></span>
        }
      </div>
      <span class="level">{{ niveauLibelle }}</span>
    </div>

    <ul class="rules">
      @for (r of regles; track r.cle) {
        <li [class.ok]="r.ok">
          <i class="ti" [class.ti-circle-check]="r.ok" [class.ti-circle]="!r.ok"></i>
          {{ r.libelle }}
        </li>
      }
    </ul>
  </div>
}
